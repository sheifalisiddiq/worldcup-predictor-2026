<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>FIFA WC26 Predictor — WE ARE 26</title>
<meta name="description" content="Predict all 104 World Cup 2026 matches. Climb the global table. We Are 26." />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#071A40" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="WC26" />
<link rel="apple-touch-icon" href="/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Noto+Sans:ital,wght@0,400;0,600;0,700;0,800;0,900;1,900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    /* ── FIFA World Cup 2026 Official Brand Palette ── */
    --wc-red:         #E8192C;
    --wc-blue:        #1144CC;
    --wc-cyan:        #00C8E8;
    --wc-purple:      #7B2CBF;
    --wc-green:       #2CB82A;
    --wc-yellow:      #FFC800;
    --wc-gold:        #C9A427;
    --wc-navy:        #071A40;
    --wc-navy-panel:  #0D2254;
    --wc-cream:       #F4F1EB;
    --wc-ink:         #0A0A18;
    --wc-white:       #FDFCFA;

    /* ── Semantic tokens (light theme default) ── */
    --cup-red:      #E8192C;
    --cup-blue:     #1144CC;
    --cup-green:    #2CB82A;
    --cup-gold:     #C9A427;
    --cup-black:    #0A0A18;
    --cup-cream:    #F4F1EB;
    --samba-yellow: #FFC800;
    --samba-green:  #066030;
    --sky:          #00C8E8;

    --bg:       #F4F1EB;
    --panel:    #FDFCFA;
    --ink:      #0A0A18;
    --ink-soft: #363652;
    --line:     #0A0A18;
    --shadow:   #0A0A18;
    --chip:     #ECEAE0;
    --muted:    #787090;
    --hair:     rgba(10,10,24,.12);
    --transition-speed: 0.28s;

    /* nav is always dark */
    --nav-bg:   #040F26;
    --nav-ink:  #FDFCFA;
  }

  [data-theme="dark"] {
    --bg:       #071A40;
    --panel:    #0D2254;
    --ink:      #F4F1EB;
    --ink-soft: #B0B8D0;
    --line:     #000000;
    --shadow:   #000000;
    --chip:     #152A5C;
    --muted:    #6A7A9A;
    --hair:     rgba(244,241,235,.14);
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body {
    margin:0; padding:0; height:100%;
    overflow:hidden;
    overscroll-behavior:none;
  }
  body {
    font-family:'Noto Sans',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  /* Pin the app shell to the visual viewport with fixed positioning instead of
     100dvh. Mobile browsers recompute dvh every frame as the URL bar shows/hides
     while scrolling, which resizes the whole flex layout and makes the UI shake.
     position:fixed sizes to the stable initial containing block — no thrash. */
  #root {
    position:fixed;
    inset:0;
    overflow:hidden;
    overscroll-behavior:none;
  }

  /* ── Typography ── */
  .display {
    font-family:'Big Shoulders Display',sans-serif;
    text-transform:uppercase;
    letter-spacing:-.02em;
    font-weight:900;
    line-height:.88;
  }
  .heavy { font-family:'Noto Sans',sans-serif; font-weight:800; }
  .mono  { font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }

  /* ── Border/shadow system (neo-brutalist, no radius) ── */
  .hard    { box-shadow:4px 4px 0 0 var(--shadow); }
  .hard-lg { box-shadow:6px 6px 0 0 var(--shadow); }
  .bd      { border:3px solid var(--line); }

  /* ── WC26 six-color stripe ── */
  .wc26-stripe {
    height:5px;
    flex-shrink:0;
    background:linear-gradient(90deg,
      #E8192C 0% 16.66%,
      #FFC800 16.66% 33.33%,
      #2CB82A 33.33% 50%,
      #1144CC 50% 66.66%,
      #00C8E8 66.66% 83.33%,
      #7B2CBF 83.33% 100%
    );
  }

  /* ── Sunburst background (landing page) ── */
  .sunburst {
    background:conic-gradient(from 0deg at 50% 50%,
      #071A40 0deg 11.25deg,    #0A2050 11.25deg 22.5deg,
      #071A40 22.5deg 33.75deg, #0A2050 33.75deg 45deg,
      #071A40 45deg 56.25deg,   #0A2050 56.25deg 67.5deg,
      #071A40 67.5deg 78.75deg, #0A2050 78.75deg 90deg,
      #071A40 90deg 101.25deg,  #0A2050 101.25deg 112.5deg,
      #071A40 112.5deg 123.75deg,#0A2050 123.75deg 135deg,
      #071A40 135deg 146.25deg, #0A2050 146.25deg 157.5deg,
      #071A40 157.5deg 168.75deg,#0A2050 168.75deg 180deg,
      #071A40 180deg 191.25deg, #0A2050 191.25deg 202.5deg,
      #071A40 202.5deg 213.75deg,#0A2050 213.75deg 225deg,
      #071A40 225deg 236.25deg, #0A2050 236.25deg 247.5deg,
      #071A40 247.5deg 258.75deg,#0A2050 258.75deg 270deg,
      #071A40 270deg 281.25deg, #0A2050 281.25deg 292.5deg,
      #071A40 292.5deg 303.75deg,#0A2050 303.75deg 315deg,
      #071A40 315deg 326.25deg, #0A2050 326.25deg 337.5deg,
      #071A40 337.5deg 348.75deg,#0A2050 348.75deg 360deg
    );
  }

  /* ── Diagonal hatch texture (dark surfaces) ── */
  .hatch {
    background-image:repeating-linear-gradient(
      45deg,
      rgba(255,255,255,.035) 0,
      rgba(255,255,255,.035) 1px,
      transparent 1px,
      transparent 12px
    );
  }

  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--ink); border-radius:0; }
  ::-webkit-scrollbar-track { background:transparent; }

  button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  img { display:block; }

  @keyframes pulseSkel  { 0%,100%{opacity:.5;} 50%{opacity:.9;} }
  @keyframes spinSlow   { to { transform:rotate(360deg); } }
  @keyframes floaty     { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  @keyframes popIn      { 0%{transform:scale(.7);opacity:0;} 60%{transform:scale(1.08);} 100%{transform:scale(1);opacity:1;} }
  @keyframes slideUp    { from{transform:translateY(20px);opacity:0;} to{transform:translateY(0);opacity:1;} }
  @keyframes slideInRight { from{transform:translateX(100%);opacity:0;} to{transform:translateX(0);opacity:1;} }
  @keyframes slideInLeft  { from{transform:translateX(-100%);opacity:0;} to{transform:translateX(0);opacity:1;} }
  @keyframes fadeIn     { from{opacity:0;} to{opacity:1;} }
  @keyframes toastSlide { from{transform:translateY(80px);opacity:0;} to{transform:translateY(0);opacity:1;} }
  @keyframes toastOut   { from{transform:translateY(0);opacity:1;} to{transform:translateY(80px);opacity:0;} }
  @keyframes pulse      { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }
  @keyframes shimmer    { 0%{background-position:-400px 0;} 100%{background-position:400px 0;} }
  @keyframes countUp    { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
  @keyframes ballBounce { 0%,100%{transform:translateY(0) rotate(0deg);} 25%{transform:translateY(-20px) rotate(-15deg);} 75%{transform:translateY(-8px) rotate(10deg);} }
  @keyframes stripeSlide { from{background-position:0 0;} to{background-position:40px 0;} }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  /* ── Toast ── */
  #toast-container {
    position:fixed; bottom:max(24px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    z-index:9999; display:flex; flex-direction:column; gap:8px; align-items:center;
    pointer-events:none;
  }
  .toast {
    font-family:'Noto Sans',sans-serif; font-weight:800;
    padding:12px 22px; border:3px solid #000; font-size:13px;
    letter-spacing:.06em; text-transform:uppercase; pointer-events:auto;
    box-shadow:5px 5px 0 0 #000;
    animation:toastSlide .3s cubic-bezier(.34,1.56,.64,1) forwards;
    white-space:nowrap;
  }
  .toast.out     { animation:toastOut .25s ease forwards; }
  .toast-success { background:#2CB82A; color:#fff; }
  .toast-info    { background:#FFC800; color:#000; }
  .toast-error   { background:#E8192C; color:#fff; }

  .screen-enter       { animation:fadeIn .22s ease forwards; }
  .screen-slide-right { animation:slideInRight .25s cubic-bezier(.34,1.1,.64,1) forwards; }
  .screen-slide-left  { animation:slideInLeft  .25s cubic-bezier(.34,1.1,.64,1) forwards; }

  .live-dot {
    width:8px; height:8px; border-radius:50%; background:#fff;
    animation:pulseSkel .9s infinite;
  }

  .skeleton-shimmer {
    background:linear-gradient(90deg,var(--chip) 25%,rgba(200,200,200,.15) 50%,var(--chip) 75%);
    background-size:400px 100%;
    animation:shimmer 1.4s infinite linear;
  }
</style>
</head>
<body>
  <div id="root">
    <!-- Instant boot screen — shown until React mounts and replaces #root's
         children. Guarantees users never see a bare blank navy screen while
         scripts download on a slow connection. -->
    <div id="boot" style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#071A40;gap:14px">
      <div class="wc26-stripe" style="position:absolute;top:0;left:0;width:100%"></div>
      <div class="display" style="color:#E8192C;font-size:clamp(48px,12vw,96px);line-height:.85">WC</div>
      <div class="display" style="color:#FDFCFA;font-size:clamp(32px,8vw,64px);line-height:.85;margin-top:-8px">26</div>
      <span style="font-size:28px;animation:spinSlow 1s linear infinite;display:block;margin-top:12px">⚽</span>
      <div class="heavy" id="boot-msg" style="color:rgba(255,255,255,.4);font-size:10px;letter-spacing:.2em;margin-top:8px">LOADING</div>
    </div>
  </div>
  <div id="toast-container"></div>
  <canvas id="confetti-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9998;"></canvas>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (reg) {
          reg.update();
          // A new SW means a new build. Activate it immediately so installed
          // PWAs can't stay frozen on a stale cached bundle.
          reg.addEventListener('updatefound', function () {
            var nw = reg.installing;
            if (nw) nw.addEventListener('statechange', function () {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                if (nw.postMessage) nw.postMessage('skipWaiting');
              }
            });
          });
        }).catch(function () {});
        // When the new SW takes control, reload once to pick up the fresh build.
        var reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (reloaded) return;
          reloaded = true;
          location.reload();
        });
      });
    }
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>

  <!-- Confetti engine -->
  <script>
  window.fireConfetti = function(opts = {}) {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const colors = opts.colors || ['#E8192C','#FFC800','#2CB82A','#1144CC','#00C8E8','#7B2CBF','#C9A427'];
    const count = opts.count || 120;
    const origin = opts.origin || { x: 0.5, y: 0.6 };
    const particles = [];
    for (let i = 0; i < count; i++) {
      const angle = (Math.random() * 360 - 180) * Math.PI / 180;
      const speed = 4 + Math.random() * 10;
      particles.push({
        x: canvas.width * origin.x,
        y: canvas.height * origin.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 8,
        size: 6 + Math.random() * 10,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * 360,
        rotSpeed: (Math.random() - .5) * 8,
        alpha: 1,
        shape: Math.random() > .5 ? 'rect' : 'circle',
      });
    }
    let frame;
    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      let alive = false;
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy;
        p.vy += .35; p.vx *= .985;
        p.rot += p.rotSpeed;
        p.alpha -= .012;
        if (p.alpha <= 0) continue;
        alive = true;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color;
        if (p.shape === 'rect') ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
        else { ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
        ctx.restore();
      }
      if (alive) frame = requestAnimationFrame(draw);
      else ctx.clearRect(0,0,canvas.width,canvas.height);
    }
    cancelAnimationFrame(frame);
    draw();
  };

  window.toast = function(msg, type='info', duration=2800) {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => el.remove(), 280);
    }, duration);
  };
  </script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script src="data.js"></script>
  <!-- Precompiled from *.jsx by `npm run build` (output in /dist).
       No in-browser Babel: plain JS loads and runs instantly, even on
       slow phones. Rebuild after editing any .jsx source. -->
  <script src="dist/rings.js"></script>
  <script src="dist/components.js"></script>
  <script src="dist/screens.js"></script>
  <script src="dist/screens2.js"></script>
  <script src="dist/app.js"></script>

  <!-- Boot watchdog: if React hasn't replaced #boot within the timeout (e.g.
       a CDN/script failed or the connection stalled), show a Reload prompt
       instead of leaving a blank screen. -->
  <script>
  (function () {
    function showError(msg) {
      var root = document.getElementById('root');
      if (!root) return;
      root.innerHTML =
        '<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#071A40;gap:14px;padding:24px;text-align:center;font-family:Noto Sans,system-ui,sans-serif">'
        + '<div class="wc26-stripe" style="position:absolute;top:0;left:0;width:100%"></div>'
        + '<div style="color:#FDFCFA;font-weight:800;font-size:18px">Couldn\'t load the app</div>'
        + '<div style="color:rgba(255,255,255,.55);font-size:13px;max-width:300px;line-height:1.5">' + msg + '</div>'
        + '<button onclick="location.reload()" style="margin-top:8px;background:#E8192C;color:#fff;border:3px solid #000;box-shadow:4px 4px 0 0 #000;font-weight:800;letter-spacing:.06em;padding:12px 22px;font-size:13px;text-transform:uppercase;cursor:pointer">Reload</button>'
        + '</div>';
    }
    window.addEventListener('error', function (e) {
      // Only JS/script errors (ErrorEvent has .message); ignore image/resource 404s.
      if (e && e.message && document.getElementById('boot')) {
        showError('Something failed while loading. Tap Reload. If it keeps happening, check your internet connection.');
      }
    });
    // Auto self-heal: if still on the boot screen after 8s, a stale/stuck
    // service worker is the usual cause (common on installed PWAs). Unregister
    // all SWs, wipe caches, and reload once (guarded so it can't loop).
    setTimeout(function () {
      if (!document.getElementById('boot')) return;
      if (sessionStorage.getItem('wc26_selfheal')) return;
      sessionStorage.setItem('wc26_selfheal', '1');
      var done = function () { location.reload(); };
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
          .catch(function () {})
          .then(function () {
            if (window.caches && caches.keys) {
              return caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              });
            }
          })
          .catch(function () {})
          .then(done);
      } else { done(); }
    }, 8000);
    // Last resort: still stuck after self-heal -> show a manual Reload.
    setTimeout(function () {
      if (document.getElementById('boot')) {
        showError('This is taking longer than usual — likely a slow connection. Tap Reload to try again.');
      }
    }, 15000);
  })();
  </script>
</body>
</html>
