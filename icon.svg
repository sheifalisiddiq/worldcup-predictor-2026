<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#071A40"/>
  <!-- Six-color stripe at top -->
  <rect x="0"   y="0" width="85"  height="18" fill="#E8192C"/>
  <rect x="85"  y="0" width="85"  height="18" fill="#FFC800"/>
  <rect x="170" y="0" width="86"  height="18" fill="#2CB82A"/>
  <rect x="256" y="0" width="85"  height="18" fill="#1144CC"/>
  <rect x="341" y="0" width="85"  height="18" fill="#00C8E8"/>
  <rect x="426" y="0" width="86"  height="18" fill="#7B2CBF"/>
  <!-- "26" display text -->
  <text x="256" y="310" font-family="Arial Black, sans-serif" font-weight="900"
    font-size="260" text-anchor="middle" fill="#FDFCFA" letter-spacing="-12">26</text>
  <!-- "WC" small label above -->
  <text x="256" y="155" font-family="Arial Black, sans-serif" font-weight="900"
    font-size="88" text-anchor="middle" fill="#E8192C" letter-spacing="8">WC</text>
  <!-- Bottom label -->
  <text x="256" y="430" font-family="Arial, sans-serif" font-weight="700"
    font-size="42" text-anchor="middle" fill="rgba(255,255,255,0.5)" letter-spacing="6">PREDICTOR</text>
  <!-- Six-color stripe at bottom -->
  <rect x="0"   y="494" width="85"  height="18" fill="#7B2CBF"/>
  <rect x="85"  y="494" width="85"  height="18" fill="#00C8E8"/>
  <rect x="170" y="494" width="86"  height="18" fill="#1144CC"/>
  <rect x="256" y="494" width="85"  height="18" fill="#2CB82A"/>
  <rect x="341" y="494" width="85"  height="18" fill="#FFC800"/>
  <rect x="426" y="494" width="86"  height="18" fill="#E8192C"/>
</svg>
